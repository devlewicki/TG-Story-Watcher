server {
    listen 80;
    server_name _;

    # Re-resolve container hostnames every 10 s so nginx picks up IP changes
    # after docker compose recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backup archives can be large; allow uploads up to 4 GiB.
    client_max_body_size 4g;
    # Long uploads/downloads for backup operations.
    proxy_request_buffering off;

    # API -> FastAPI backend (preserves the X-API-Token header).
    # NOTE: when using a variable in proxy_pass, nginx passes the full
    # original request URI — so we build the complete URL in the variable.
    location /api/ {
        set $upstream_api http://backend:8000$request_uri;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Telegram auth through the VPN tunnel is slow (multiple MTProto RPCs).
        # The default 60s read timeout was producing 504 errors mid-login.
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Everything else -> Next.js frontend.
    location / {
        set $upstream_fe http://frontend:3000$request_uri;
        proxy_pass $upstream_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
