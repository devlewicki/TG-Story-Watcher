services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storywatcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storywatcher}
      POSTGRES_DB: ${POSTGRES_DB:-storywatcher}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storywatcher}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: tg-story-watcher-backend:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://storywatcher:storywatcher@postgres:5432/storywatcher}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSIONS_DIR: ${SESSIONS_DIR:-/data/sessions}
      TELEGRAM_PROXY_ENABLED: ${TELEGRAM_PROXY_ENABLED:-false}
      TELEGRAM_PROXY_HOST: ${TELEGRAM_PROXY_HOST:-}
      TELEGRAM_PROXY_PORT: ${TELEGRAM_PROXY_PORT:-}
      TELEGRAM_PROXY_SECRET: ${TELEGRAM_PROXY_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8000)); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:8000"
    volumes:
      - sessions_data:/data/sessions

  worker:
    image: tg-story-watcher-backend:latest
    restart: unless-stopped
    # Combined process: periodic story sync (scheduler) + queue processing in
    # one process, because Telethon session files can't be shared across
    # processes.
    command: python -m app.workers.combined
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://storywatcher:storywatcher@postgres:5432/storywatcher}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSIONS_DIR: ${SESSIONS_DIR:-/data/sessions}
      STORYWATCHER_SYNC_INTERVAL: ${STORYWATCHER_SYNC_INTERVAL:-30}
      TELEGRAM_PROXY_ENABLED: ${TELEGRAM_PROXY_ENABLED:-false}
      TELEGRAM_PROXY_HOST: ${TELEGRAM_PROXY_HOST:-}
      TELEGRAM_PROXY_PORT: ${TELEGRAM_PROXY_PORT:-}
      TELEGRAM_PROXY_SECRET: ${TELEGRAM_PROXY_SECRET:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - sessions_data:/data/sessions

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  sessions_data: