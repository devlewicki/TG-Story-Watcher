services:
  vpn:
    build: ./docker/vpn
    image: tg-story-watcher-vpn:latest
    restart: unless-stopped
    environment:
      VPN_SUBSCRIPTION_URL: ${VPN_SUBSCRIPTION_URL:-}
      VPN_REFRESH_INTERVAL: ${VPN_REFRESH_INTERVAL:-3600}
      VPN_SOCKS_PORT: ${VPN_SOCKS_PORT:-1080}
      VPN_LOG_LEVEL: ${VPN_LOG_LEVEL:-warning}
      VPN_TEST_URL: ${VPN_TEST_URL:-https://www.gstatic.com/generate_204}
      VPN_TEST_TIMEOUT: ${VPN_TEST_TIMEOUT:-8}
      VPN_PROBE_INTERVAL: ${VPN_PROBE_INTERVAL:-10}
      VPN_FAIL_THRESHOLD: ${VPN_FAIL_THRESHOLD:-3}
      VPN_SCAN_PORT: ${VPN_SCAN_PORT:-1081}
      VPN_SCAN_SLEEP: ${VPN_SCAN_SLEEP:-1.0}
      VPN_SCAN_ATTEMPTS: ${VPN_SCAN_ATTEMPTS:-2}
    healthcheck:
      test: ["CMD", "curl", "-x", "socks5://127.0.0.1:1080", "-sf", "https://www.gstatic.com/generate_204"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 240s
      start_interval: 5s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storywatcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storywatcher}
      POSTGRES_DB: ${POSTGRES_DB:-storywatcher}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storywatcher}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: tg-story-watcher-backend:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://storywatcher:storywatcher@postgres:5432/storywatcher}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSIONS_DIR: ${SESSIONS_DIR:-/data/sessions}
      TELEGRAM_PROXY_ENABLED: ${TELEGRAM_PROXY_ENABLED:-false}
      TELEGRAM_PROXY_HOST: ${TELEGRAM_PROXY_HOST:-}
      TELEGRAM_PROXY_PORT: ${TELEGRAM_PROXY_PORT:-}
      TELEGRAM_PROXY_SECRET: ${TELEGRAM_PROXY_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      vpn:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:8000"
    volumes:
      - sessions_data:/data/sessions

  worker:
    image: tg-story-watcher-backend:latest
    restart: unless-stopped
    # Combined process: periodic story sync (scheduler) + queue processing in
    # one process, because Telethon session files can't be shared across
    # processes.
    command: python -m app.workers.combined
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://storywatcher:storywatcher@postgres:5432/storywatcher}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSIONS_DIR: ${SESSIONS_DIR:-/data/sessions}
      STORYWATCHER_SYNC_INTERVAL: ${STORYWATCHER_SYNC_INTERVAL:-30}
      TELEGRAM_PROXY_ENABLED: ${TELEGRAM_PROXY_ENABLED:-false}
      TELEGRAM_PROXY_HOST: ${TELEGRAM_PROXY_HOST:-}
      TELEGRAM_PROXY_PORT: ${TELEGRAM_PROXY_PORT:-}
      TELEGRAM_PROXY_SECRET: ${TELEGRAM_PROXY_SECRET:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      vpn:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - sessions_data:/data/sessions

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  sessions_data: